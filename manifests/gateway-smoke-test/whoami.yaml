apiVersion: v1
kind: Namespace
metadata:
  name: gateway-demo
  labels:
    app.kubernetes.io/name: gateway-demo
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: gateway-demo
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: gateway-smoke-test

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: whoami

  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
        app.kubernetes.io/part-of: gateway-smoke-test

    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Values are supplied by External Secrets Operator.
          envFrom:
            - secretRef:
                name: demo-app-database

          # Explicit container security configuration.
          # This satisfies the Kyverno privileged-container policy.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: gateway-demo
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: gateway-smoke-test

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: whoami

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: gateway-demo
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-public-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - whoami-dev.kapilkumaria.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          port: 80
          weight: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-http-redirect
  namespace: gateway-demo
  labels:
    app.kubernetes.io/name: whoami-http-redirect
    app.kubernetes.io/component: http-redirect
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-public-gateway
      namespace: traefik
      sectionName: web

  hostnames:
    - whoami-dev.kapilkumaria.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
