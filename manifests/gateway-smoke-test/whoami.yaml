apiVersion: v1
kind: Namespace
metadata:
  name: gateway-demo
  labels:
    purpose: gateway-api-smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: gateway-demo
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: gateway-smoke-test
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: whoami

  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
        app.kubernetes.io/part-of: gateway-smoke-test

    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: gateway-demo
  labels:
    app.kubernetes.io/name: whoami
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: whoami

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: gateway-demo
  labels:
    app.kubernetes.io/name: whoami
spec:
  parentRefs:
    - name: shared-public-gateway
      namespace: traefik
      sectionName: web

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: whoami
          port: 80
          weight: 1
