apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: gateway-demo

  labels:
    app.kubernetes.io/name: allow-traefik-ingress
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: whoami

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik

          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik

      ports:
        - protocol: TCP
          port: 80
