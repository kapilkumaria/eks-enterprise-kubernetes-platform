# ============================================================
# ExternalDNS provider
# ============================================================

provider:
  name: aws

# ============================================================
# Kubernetes resource sources
# ============================================================

sources:
  - gateway-httproute

# ============================================================
# Amazon Route 53 scope
# ============================================================

domainFilters:
  - "kapilkumaria.com"

# ============================================================
# Provider-specific command arguments
# ============================================================

extraArgs:
  zone-id-filter: Z0058793HC1B8WCMOEQ4
  aws-zone-type: public

# ============================================================
# DNS ownership registry
# ============================================================

registry: txt

txtOwnerId: eks-enterprise-platform-dev

txtPrefix: external-dns-

# ============================================================
# Initial safety policy
# ============================================================

policy: upsert-only

# ============================================================
# Reconciliation
# ============================================================

interval: 1m

triggerLoopOnEvent: true

# ============================================================
# ServiceAccount and IRSA
# ============================================================

serviceAccount:
  create: true
  name: external-dns

  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::931058976119:role/eks-enterprise-platform-dev-external-dns-irsa"

# ============================================================
# Workload security
# ============================================================

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

# ============================================================
# Resource management
# ============================================================

resources:
  requests:
    cpu: 50m
    memory: 64Mi

  limits:
    cpu: 200m
    memory: 256Mi

# ============================================================
# Logging
# ============================================================

logLevel: info
logFormat: json

# ============================================================
# Monitoring
# ============================================================

serviceMonitor:
  enabled: false
