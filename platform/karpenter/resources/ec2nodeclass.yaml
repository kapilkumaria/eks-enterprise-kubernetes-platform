apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default

  labels:
    app.kubernetes.io/name: karpenter
    app.kubernetes.io/component: node-provisioning
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  amiSelectorTerms:
    - alias: al2023@latest

  role: "KarpenterNodeRole-eks-enterprise-platform-dev"

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-enterprise-platform-dev"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-enterprise-platform-dev"

  tags:
    Project: eks-enterprise-platform
    Environment: dev
    ManagedBy: Karpenter
    karpenter.sh/discovery: "eks-enterprise-platform-dev"

  blockDeviceMappings:
    - deviceName: /dev/xvda

      ebs:
        volumeSize: 40Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
