apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default

  labels:
    app.kubernetes.io/name: karpenter
    app.kubernetes.io/component: node-provisioning
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  template:
    metadata:
      labels:
        node-provisioner: karpenter
        environment: dev
        workload-tier: general

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
            - spot

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
            - r

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - "2"

      expireAfter: 720h

  limits:
    cpu: "40"
    memory: 160Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
