apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  labels:
    app.kubernetes.io/name: disallow-privileged-containers
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: enterprise-kubernetes-platform
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: privileged-containers

      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - gateway-demo

      validate:
        allowExistingViolations: true

        message: >-
          Privileged containers are prohibited in application namespaces.

        pattern:
          spec:
            containers:
              - securityContext:
                  privileged: "false | null"
