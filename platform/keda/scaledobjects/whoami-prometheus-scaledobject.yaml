apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: whoami-prometheus
  namespace: gateway-demo

  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: enterprise-kubernetes-platform
    autoscaling.kapilkumaria.com/type: keda-prometheus

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami

  pollingInterval: 15
  cooldownPeriod: 120
  initialCooldownPeriod: 30

  minReplicaCount: 2
  maxReplicaCount: 6

  fallback:
    failureThreshold: 3
    replicas: 2

  advanced:
    restoreToOriginalReplicaCount: false

    horizontalPodAutoscalerConfig:
      name: keda-hpa-whoami-prometheus

      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60

            - type: Percent
              value: 100
              periodSeconds: 60

        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Max
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60

  triggers:
    - type: prometheus

      metadata:
        serverAddress: http://observability-kube-prometh-prometheus.monitoring.svc.cluster.local:9090

        metricName: whoami_traefik_requests_per_second

        query: |
          sum(
            rate(
              traefik_service_requests_total{
                service=~".*whoami.*"
              }[2m]
            )
          )

        threshold: "5"

        activationThreshold: "0.5"

        ignoreNullValues: "false"
