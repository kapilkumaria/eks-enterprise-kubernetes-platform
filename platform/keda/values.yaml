# KEDA platform configuration

operator:
  replicaCount: 2

metricsServer:
  replicaCount: 2

webhooks:
  replicaCount: 2

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  operator:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 300Mi

  metricServer:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 300Mi

  webhooks:
    requests:
      cpu: 25m
      memory: 50Mi
    limits:
      cpu: 150m
      memory: 200Mi

prometheus:
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true

  operator:
    enabled: true
    serviceMonitor:
      enabled: true

  webhooks:
    enabled: true
    serviceMonitor:
      enabled: true
