apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-database
  namespace: gateway-demo

  labels:
    app.kubernetes.io/name: demo-app-database
    app.kubernetes.io/component: application-secret
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  refreshInterval: 1m

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: demo-app-database
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

      metadata:
        labels:
          app.kubernetes.io/name: demo-app-database
          app.kubernetes.io/managed-by: external-secrets

  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: eks-enterprise-platform/dev/demo-app/database
        property: username

    - secretKey: DB_PASSWORD
      remoteRef:
        key: eks-enterprise-platform/dev/demo-app/database
        property: password

    - secretKey: DB_HOST
      remoteRef:
        key: eks-enterprise-platform/dev/demo-app/database
        property: host

    - secretKey: DB_PORT
      remoteRef:
        key: eks-enterprise-platform/dev/demo-app/database
        property: port

    - secretKey: DB_NAME
      remoteRef:
        key: eks-enterprise-platform/dev/demo-app/database
        property: database
