apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production

  labels:
    app.kubernetes.io/name: letsencrypt-production
    app.kubernetes.io/component: certificate-issuer
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  acme:
    email: kapil.kumaria@gmail.com

    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-production-account-key

    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: shared-public-gateway
                namespace: traefik
                kind: Gateway
