apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whoami
  namespace: gateway-demo

  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: enterprise-kubernetes-platform
    environment: dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami

  minReplicas: 2
  maxReplicas: 6

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0

      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

        - type: Pods
          value: 2
          periodSeconds: 60

      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300

      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

      selectPolicy: Max

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 60
