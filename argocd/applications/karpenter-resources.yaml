apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-resources
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40"

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: karpenter-resources
    app.kubernetes.io/component: node-provisioning
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  project: platform

  source:
    repoURL: https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
    targetRevision: main
    path: platform/karpenter/resources

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
