apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "10"
  name: kyverno-policies
  namespace: argocd


  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: kyverno-policies
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  project: platform

  source:
    repoURL: https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
    targetRevision: main
    path: platform/kyverno/policies

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5

      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
