apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  project: platform

  sources:
    - repoURL: quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: v1.20.2

      helm:
        releaseName: cert-manager

        valueFiles:
          - $values/platform/cert-manager/values.yaml

    - repoURL: https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
