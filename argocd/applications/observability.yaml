apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "30"

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  project: platform

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.0.1

      helm:
        releaseName: observability

        valueFiles:
          - $values/platform/observability/kube-prometheus-stack/values.yaml

    - repoURL: https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5

      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
