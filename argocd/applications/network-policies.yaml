apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "20"

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: network-policies
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  project: platform

  source:
    repoURL: https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
    targetRevision: main
    path: platform/network-policies

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5

      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
