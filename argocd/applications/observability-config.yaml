apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '29'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: observability-config
    app.kubernetes.io/component: monitoring-configuration
    app.kubernetes.io/part-of: enterprise-kubernetes-platform
spec:
  project: platform
  source:
    repoURL: https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
    targetRevision: main
    path: platform/observability/config
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
