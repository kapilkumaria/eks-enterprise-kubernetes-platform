apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-3"

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/component: event-driven-autoscaling
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  project: platform

  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: "2.20.2"

      helm:
        releaseName: keda
        valueFiles:
          - $values/platform/keda/values.yaml

    - repoURL: https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: keda

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
