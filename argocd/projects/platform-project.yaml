apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd

  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/part-of: enterprise-kubernetes-platform

spec:
  description: Enterprise Kubernetes platform services

  sourceRepos:
    - https://github.com/kapilkumaria/eks-enterprise-kubernetes-platform.git
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://kubernetes-sigs.github.io/external-dns/
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno/
    - https://traefik.github.io/charts
    - quay.io/jetstack/charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  orphanedResources:
    warn: true
